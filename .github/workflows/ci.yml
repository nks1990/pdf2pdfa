name: CI

on:
  push:
    branches: [main, agent/pdfa-v4-integration]
  pull_request:
    branches: [main, agent/pdfa-v4-integration]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]" "ruff>=0.11"
      - name: Compile sources
        run: python -m compileall -q pdf2pdfa tests
      - name: Correctness lint
        run: ruff check pdf2pdfa tests
      - name: Test
        run: pytest -v
      - name: Dependency consistency
        run: python -m pip check

  platform-smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m compileall -q pdf2pdfa tests
      - run: pytest -q

  pdfa-compliance:
    name: veraPDF PDF/A-${{ matrix.level }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        level: ["1b", "2b", "3b"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
      - name: Build deterministic candidate
        env:
          PDFA_LEVEL: ${{ matrix.level }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          from pdf2pdfa import Converter

          fixture = Path("tests/data/sample.pdf")
          fixture.write_bytes(base64.b64decode(Path("tests/data/sample.pdf.b64").read_text()))
          level = os.environ["PDFA_LEVEL"]
          Converter(level=level, backend="pikepdf").convert(fixture, "ci-output.pdf")
          PY
      - name: Validate with veraPDF 1.30.2
        run: |
          docker run --rm -v "$PWD:/data" ghcr.io/verapdf/cli:1.30.2 \
            --format xml --flavour ${{ matrix.level }} /data/ci-output.pdf > verapdf.xml
      - name: Assert veraPDF compliance
        env:
          PDFA_LEVEL: ${{ matrix.level }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from pdf2pdfa.validator import parse_verapdf_xml

          level = os.environ["PDFA_LEVEL"]
          result = parse_verapdf_xml(Path("verapdf.xml").read_text(), level)
          if not result.compliant:
              raise SystemExit(
                  f"PDF/A-{level} veraPDF failure: {result.failed_checks} failed checks; "
                  f"rules={result.failed_rules}"
              )
          print(f"PDF/A-{level} veraPDF PASS: {result.passed_checks} checks")
          PY

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
