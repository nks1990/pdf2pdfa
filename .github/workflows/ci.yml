name: CI

on:
  push:
    branches: [main, agent/pdfa-v4-integration]
  pull_request:
    branches: [main, agent/pdfa-v4-integration]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[test]
      - run: pytest -v

  pdfa-compliance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[test]
      - name: Build deterministic PDF/A-1b fixture
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          from pdf2pdfa import Converter

          fixture = Path("tests/data/sample.pdf")
          fixture.write_bytes(base64.b64decode(Path("tests/data/sample.pdf.b64").read_text()))
          Converter(level="1b").convert(str(fixture), "ci-output.pdf")
          PY
      - name: Validate with veraPDF 1.30.2
        run: |
          docker run --rm -v "$PWD:/data" ghcr.io/verapdf/cli:1.30.2 \
            --format xml --flavour 1b /data/ci-output.pdf > verapdf.xml
      - name: Assert veraPDF compliance
        run: |
          python - <<'PY'
          from pathlib import Path
          from pdf2pdfa.validator import parse_verapdf_xml

          result = parse_verapdf_xml(Path("verapdf.xml").read_text(), "1b")
          if not result.compliant:
              raise SystemExit(f"veraPDF failed: {result.failed_checks} failed checks")
          print(f"veraPDF PASS: {result.passed_checks} checks")
          PY
