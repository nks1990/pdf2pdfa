name: Publish to PyPI

# Release-only automation. There is intentionally no push/PR CI workflow.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling and project
        run: python -m pip install --upgrade -e ".[dev]"

      - name: Run full owned release gate
        run: python scripts/check.py --full

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
