[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2pdfa"
version = "5.0.0"
description = "Dependency-free PDF to PDF/A conversion, validation and fidelity using a repository-owned engine"
authors = [{name = "nks1990", email = "nks1990@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pdf", "pdfa", "archiving", "digital-preservation", "pdf-parser", "pdf-validator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "twine>=5.0",
]

[project.scripts]
pdf2pdfa = "pdf2pdfa.cli:main"

[project.urls]
Homepage = "https://github.com/nks1990/pdf2pdfa"
Repository = "https://github.com/nks1990/pdf2pdfa"
Issues = "https://github.com/nks1990/pdf2pdfa/issues"
Changelog = "https://github.com/nks1990/pdf2pdfa/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf2pdfa*"]

[tool.setuptools.package-data]
pdf2pdfa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/native", "tests/owned"]
addopts = "-ra"
