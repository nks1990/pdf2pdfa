[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2pdfa"
version = "4.0.0"
description = "Adaptive PDF to PDF/A converter with preflight and optional veraPDF verification"
authors = [{name = "nks1990", email = "nks1990@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["pdf", "pdfa", "archive", "verapdf", "pikepdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]

dependencies = [
    "pikepdf>=8.0.0",
    "fonttools>=4.0.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
pdf2pdfa = "pdf2pdfa.cli:cli"

[project.urls]
Homepage = "https://github.com/nks1990/pdf2pdfa"
Documentation = "https://github.com/nks1990/pdf2pdfa/tree/main/docs"
Repository = "https://github.com/nks1990/pdf2pdfa"
Issues = "https://github.com/nks1990/pdf2pdfa/issues"
Changelog = "https://github.com/nks1990/pdf2pdfa/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf2pdfa*"]

[tool.setuptools.package-data]
pdf2pdfa = ["data/*.b64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Keep CI focused on correctness defects. Broader formatting/style adoption can
# happen separately without making a major release hostage to cosmetic churn.
select = ["E9", "F63", "F7", "F82"]
